name: Bug Report
description: 提交一个 Bug，帮助项目定位和修复问题。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请确认
        - 已搜索 Issue，确认没有重复
        - 已确认这不是使用方式问题（可先阅读 [docs](https://github.com/nynu-codelab/docs)）
  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清晰描述 Bug 是什么、发生在哪里。
      placeholder: 例如：点击“保存”按钮后页面无响应，控制台报错。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、浏览器版本 / 运行时版本（如 Node 22、Python 3.12、JDK 21）。
      placeholder: "例如：Windows 11 / Chrome 131 / Node 22.12.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 一步一步描述如何复现。
      placeholder: |
        1. 打开页面
        2. 点击 ...
        3. 观察 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 粘贴相关日志（终端、浏览器 Console、服务端日志）。注意不要包含任何密钥。
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏
      description: 拖拽图片或粘贴截图。
  - type: input
    id: related
    attributes:
      label: 相关 Issue
      description: 如果有相关的 Issue / PR，填写链接或编号。
