name: Feature Request
description: 提出一个新功能或改进建议。
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 用一两句话说明你想要的功能。
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 在什么场景下会用到这个功能？
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要
      description: 这个功能解决了什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你期望它如何工作？可以描述交互、接口或界面。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可能的替代方案
      description: 你考虑过其他方案吗？
