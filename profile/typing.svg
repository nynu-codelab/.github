<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 110" width="680" height="110" role="img" aria-label="Welcome to CodeLab.">
  <style>
    text { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace; font-weight: 700; }
    .char { opacity: 0; animation: type 0.05s linear forwards; }
    @keyframes type { to { opacity: 1; } }
    .cursor { opacity: 0; animation: blink 1s step-end 1.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <text x="12" y="80" font-size="54" fill="#1f2328" textLength="612" lengthAdjust="spacingAndGlyphs">
    <tspan class="char" style="animation-delay:0s">W</tspan>
    <tspan class="char" style="animation-delay:0.09s">e</tspan>
    <tspan class="char" style="animation-delay:0.18s">l</tspan>
    <tspan class="char" style="animation-delay:0.27s">c</tspan>
    <tspan class="char" style="animation-delay:0.36s">o</tspan>
    <tspan class="char" style="animation-delay:0.45s">m</tspan>
    <tspan class="char" style="animation-delay:0.54s">e</tspan>
    <tspan class="char" style="animation-delay:0.63s">&#160;</tspan>
    <tspan class="char" style="animation-delay:0.72s">t</tspan>
    <tspan class="char" style="animation-delay:0.81s">o</tspan>
    <tspan class="char" style="animation-delay:0.9s">&#160;</tspan>
    <tspan class="char" style="animation-delay:0.99s">C</tspan>
    <tspan class="char" style="animation-delay:1.08s">o</tspan>
    <tspan class="char" style="animation-delay:1.17s">d</tspan>
    <tspan class="char" style="animation-delay:1.26s">e</tspan>
    <tspan class="char" style="animation-delay:1.35s">L</tspan>
    <tspan class="char" style="animation-delay:1.44s">a</tspan>
    <tspan class="char" style="animation-delay:1.53s">b</tspan>
    <tspan class="char" style="animation-delay:1.62s">.</tspan>
  </text>
  <rect class="cursor" x="634" y="40" width="30" height="54" rx="5" fill="#1f2328"/>
</svg>
