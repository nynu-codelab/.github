<svg xmlns="http://www.w3.org/2000/svg" width="680" height="100" viewBox="0 0 680 100" role="img" aria-label="Welcome to CodeLab.">
  <style>
    text { font-family: "Courier New", Courier, "Liberation Mono", monospace; }
    .char { opacity: 0; animation: type 0.05s linear forwards; }
    @keyframes type { to { opacity: 1; } }
    .cursor { opacity: 0; animation: blink 1s step-end 2s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <text x="14" y="74" font-size="50" fill="#24292f">
    <tspan class="char" style="animation-delay:0s">W</tspan>
    <tspan class="char" style="animation-delay:0.1s">e</tspan>
    <tspan class="char" style="animation-delay:0.2s">l</tspan>
    <tspan class="char" style="animation-delay:0.3s">c</tspan>
    <tspan class="char" style="animation-delay:0.4s">o</tspan>
    <tspan class="char" style="animation-delay:0.5s">m</tspan>
    <tspan class="char" style="animation-delay:0.6s">e</tspan>
    <tspan class="char" style="animation-delay:0.7s">&#160;</tspan>
    <tspan class="char" style="animation-delay:0.8s">t</tspan>
    <tspan class="char" style="animation-delay:0.9s">o</tspan>
    <tspan class="char" style="animation-delay:1s">&#160;</tspan>
    <tspan class="char" style="animation-delay:1.1s">C</tspan>
    <tspan class="char" style="animation-delay:1.2s">o</tspan>
    <tspan class="char" style="animation-delay:1.3s">d</tspan>
    <tspan class="char" style="animation-delay:1.4s">e</tspan>
    <tspan class="char" style="animation-delay:1.5s">L</tspan>
    <tspan class="char" style="animation-delay:1.6s">a</tspan>
    <tspan class="char" style="animation-delay:1.7s">b</tspan>
    <tspan class="char" style="animation-delay:1.8s">.</tspan>
  </text>
  <rect class="cursor" x="638" y="34" width="28" height="50" rx="4" fill="#24292f"/>
</svg>
